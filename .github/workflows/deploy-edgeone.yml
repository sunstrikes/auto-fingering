name: Deploy to EdgeOne Pages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: edgeone-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy dist to EdgeOne Pages
    runs-on: ubuntu-latest
    env:
      EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'musicxml-fingering' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment token
        run: |
          if [ -z "$EDGEONE_PAGES_API_TOKEN" ]; then
            echo "::error title=Missing EDGEONE_PAGES_API_TOKEN::Add an EdgeOne API token in Settings → Secrets and variables → Actions. See docs/deployment-edgeone.md."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx --yes edgeone@1.7.2 makers deploy ./dist -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_PAGES_API_TOKEN" --json
